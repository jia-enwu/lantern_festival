<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>猜燈謎遊戲</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
      line-height: 1.6;
    }
    #question {
      font-size: 20px;
      margin: 20px 0;
    }
    #result {
      margin: 10px 0;
    }
    #score {
      margin: 10px 0;
    }
    button {
      margin: 5px;
      padding: 5px 10px;
      font-size: 16px;
    }
    input[type="text"] {
      width: 200px;
      padding: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>猜燈謎遊戲</h1>

  <!-- 燈謎題目顯示區 -->
  <div id="question">按「下一題」開始答題</div>

  <!-- 答案輸入欄位 -->
  <input type="text" id="answerInput" placeholder="輸入你的答案" />

  <!-- 送出答案按鈕 -->
  <button id="submitBtn">送出答案</button>

  <!-- 結果顯示 -->
  <div id="result"></div>

  <!-- 分數顯示 -->
  <div id="score">目前分數：0/0</div>

  <!-- 下一題按鈕 -->
  <button id="nextBtn">下一題</button>

  <script>
    // 燈謎清單（可自行增修）
const riddles = [
  // 1
  {
    question: "有什么东西白天看不见，晚上才能看见？",
    answer: "星星"
  },
  // 2
  {
    question: "什么东西越洗越脏？",
    answer: "水"
  },
  // 3
  {
    question: "什么东西可以用嘴巴吹大，却不能吃？",
    answer: "气球"
  },
  // 4
  {
    question: "什么东西走路没有脚，却能带你到处去？",
    answer: "车"
  },
  // 5
  {
    question: "什么东西一插就亮，一拔就黑？",
    answer: "电灯"
  },
  // 6
  {
    question: "永远在水里，却不会溺水的是什么？",
    answer: "鱼"
  },
  // 7
  {
    question: "一加一不是二（打一个汉字）",
    answer: "王"
  },
  // 8
  {
    question: "什么东西越用就越少？",
    answer: "钱"
  },
  // 9
  {
    question: "两点之间，哪段路最短？",
    answer: "直线"
  },
  // 10
  {
    question: "哪种“瓜”不能吃？",
    answer: "傻瓜"
  },
  // 11
  {
    question: "哪种蚊子不咬人？",
    answer: "死蚊子"
  },
  // 12
  {
    question: "什么东西请人吃没人要，自己吃又觉得苦？",
    answer: "药"
  },
  // 13
  {
    question: "在家时它从不进门，出门时却跟着你到处跑。",
    answer: "钥匙"
  },
  // 14
  {
    question: "什么门永远敞开，却从来没有人真正进出？",
    answer: "球门"
  },
  // 15
  {
    question: "小明的爸爸有三个儿子，大儿子叫大毛，二儿子叫二毛，三儿子叫什么？",
    answer: "小明"
  },
  // 16
  {
    question: "什么老鼠两条腿走路？",
    answer: "米老鼠"
  },
  // 17
  {
    question: "什么鸭子两条腿走路？",
    answer: "所有鸭子"
  },
  // 18
  {
    question: "哪一种语言世界通用，却不用嘴巴说？",
    answer: "微笑"
  },
  // 19
  {
    question: "把什么打破了不会受到处分，反而会得到奖励？",
    answer: "记录"
  },
  // 20
  {
    question: "什么布用刀也剪不断？",
    answer: "瀑布"
  },
  // 21
  {
    question: "什么事情你明明没有做，却要受罚？",
    answer: "作业"
  },
  // 22
  {
    question: "汽车在右转弯时，哪只轮胎不转？",
    answer: "备用轮胎"
  },
  // 23
  {
    question: "什么东西自己不会动，却能带你走遍世界？",
    answer: "地图"
  },
  // 24
  {
    question: "什么东西打破了才能分享？",
    answer: "鸡蛋"
  },
  // 25
  {
    question: "什么动物天天熬夜？",
    answer: "熊猫"
  },
  // 26
  {
    question: "大象的左耳像什么？",
    answer: "右耳"
  },
  // 27
  {
    question: "哪种疼痛最容易“传染”？",
    answer: "牙疼"
  },
  // 28
  {
    question: "熊跳进水里会变成什么？",
    answer: "湿熊"
  },
  // 29
  {
    question: "什么动物最没有方向感？",
    answer: "麋鹿"
  },
  // 30
  {
    question: "什么东西往上升，也往下流？",
    answer: "温度"
  }
];



    let currentRiddle = null; // 目前出的題目
    let score = 0;            // 答對題數
    let total = 0;            // 出題總數

    const questionDiv = document.getElementById("question");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultDiv = document.getElementById("result");
    const scoreDiv = document.getElementById("score");

    // 按「下一題」時，隨機挑選一個燈謎並顯示
    function nextRiddle() {
      currentRiddle = riddles[Math.floor(Math.random() * riddles.length)];
      questionDiv.textContent = currentRiddle.question;
      answerInput.value = "";
      resultDiv.textContent = "";
    }

    // 按「送出答案」時，檢查是否答對
    function checkAnswer() {
      if (!currentRiddle) {
        resultDiv.style.color = "red";
        resultDiv.textContent = "請先按「下一題」開始遊戲！";
        return;
      }
      const userAnswer = answerInput.value.trim();
      if (userAnswer === currentRiddle.answer) {
        resultDiv.style.color = "green";
        resultDiv.textContent = "恭喜你，答對了！";
        score++;
      } else {
        resultDiv.style.color = "red";
        resultDiv.textContent = `很可惜，正確答案是：${currentRiddle.answer}`;
      }
      total++;
      scoreDiv.textContent = `目前分數：${score}/${total}`;
    }

    // 綁定按鈕事件
    nextBtn.addEventListener("click", nextRiddle);
    submitBtn.addEventListener("click", checkAnswer);
  </script>
</body>
</html>
