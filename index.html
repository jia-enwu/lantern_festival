<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>猜燈謎遊戲 - 多選題 (順序版)</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
      line-height: 1.6;
    }
    #question {
      font-size: 20px;
      margin: 20px 0;
    }
    #options {
      margin: 10px 0;
      text-align: left;
      display: inline-block;
    }
    #result {
      margin: 10px 0;
    }
    #score {
      margin: 10px 0;
    }
    button {
      margin: 5px;
      padding: 5px 10px;
      font-size: 16px;
    }
    input[type="radio"] {
      transform: scale(1.2);
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h1>猜燈謎遊戲（多選順序版）</h1>

  <!-- 燈謎題目顯示區 -->
  <div id="question">請按「下一題」開始答題</div>

  <!-- 選項顯示區 -->
  <div id="options"></div>

  <!-- 結果顯示 -->
  <div id="result"></div>

  <!-- 分數顯示 -->
  <div id="score">目前分數：0/0</div>

  <!-- 按鈕 -->
  <button id="submitBtn">送出答案</button>
  <button id="nextBtn">下一題</button>

  <script>
    // 多選題型的燈謎清單（依照順序出題）
    // question: 題目
    // options: 選項 (陣列)
    // correctIndex: 正確答案在 options 裡的索引 (0~n)
    const riddles = [
      {
        question: "什么东西会“走”，却没有腿？",
        options: ["鞋子", "钟（或表）", "桌子", "鱼"],
        correctIndex: 1
      },
      {
        question: "什么东西有“脚”，却不会走路？",
        options: ["桌子", "袜子", "椅子", "钟"],
        correctIndex: 0
      },
      {
        question: "什么东西白天见不到，只有晚上才能见到？",
        options: ["黑夜", "星星", "太阳", "月亮"],
        correctIndex: 1
      },
      {
        question: "什么东西晚上见不到，只有白天才能见到？",
        options: ["星星", "云", "太阳", "灯"],
        correctIndex: 2
      },
      {
        question: "什么东西越热越爱往外跑？",
        options: ["冰", "汗", "蒸汽", "热水"],
        correctIndex: 1
      },
      {
        question: "什么东西戴在眼睛上，你却看不到它？",
        options: ["眼镜", "隐形眼镜", "帽子", "耳机"],
        correctIndex: 0
      },
      {
        question: "什么东西没有生命，却能帮助你走路？",
        options: ["椅子", "鞋子", "拐杖", "飞机"],
        correctIndex: 1
      },
      {
        question: "什么东西脱了皮，里面还有皮？",
        options: ["香蕉", "土豆", "洋葱", "橘子"],
        correctIndex: 2
      },
      {
        question: "什么“马”永远不会跑？",
        options: ["斑马", "木马", "白马", "夜马"],
        correctIndex: 1
      },
      {
        question: "什么动物天天在水里，却不会溺水？",
        options: ["青蛙", "鱼", "鸭子", "乌龟"],
        correctIndex: 1
      },
      {
        question: "什么东西越洗越小？",
        options: ["头发", "碗", "肥皂", "毛巾"],
        correctIndex: 2
      },
      {
        question: "下雨不停的时候，哪种伞一点儿也派不上用场？",
        options: ["雨伞", "太阳伞", "折叠伞", "透明伞"],
        correctIndex: 1
      },
      {
        question: "为什么“秘密”是世界上最轻的东西？",
        options: [
          "因为它飘在空中",
          "因为它没有质量",
          "因为说出去就没了",
          "因为太虚幻"
        ],
        correctIndex: 2
      },
      {
        question: "哪种“鸡”不会叫？",
        options: ["烤鸡", "母鸡", "公鸡", "炸鸡"],
        correctIndex: 3
      },
      {
        question: "什么水永远不会结冰？",
        options: ["热水", "纯净水", "盐水", "海水"],
        correctIndex: 0
      }
    ];

    let currentIndex = -1; // 用來指示當前題目索引，-1 代表尚未開始
    let score = 0;         // 答對題數
    let total = 0;         // 出題總數

    const questionDiv = document.getElementById("question");
    const optionsDiv = document.getElementById("options");
    const resultDiv = document.getElementById("result");
    const scoreDiv = document.getElementById("score");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");

    // 顯示指定索引的題目
    function showRiddle(index) {
      const riddle = riddles[index];
      questionDiv.textContent = riddle.question;
      optionsDiv.innerHTML = "";
      resultDiv.textContent = "";

      // 動態顯示選項 (使用 radio button)
      riddle.options.forEach((option, idx) => {
        const label = document.createElement("label");
        label.style.display = "block";
        label.style.marginBottom = "8px";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "riddleOption"; 
        radio.value = idx;  // 選項索引

        label.appendChild(radio);
        label.appendChild(document.createTextNode(option));

        optionsDiv.appendChild(label);
      });
    }

    // 「下一題」的動作：切換到下一題（順序）
    function nextRiddle() {
      // 先檢查是否還有未出完的題目
      if (currentIndex < riddles.length - 1) {
        currentIndex++;
        showRiddle(currentIndex);
      } else {
        // 如果已經到最後一題，顯示提示
        resultDiv.style.color = "blue";
        resultDiv.textContent = "題目已全部結束！";
      }
    }

    // 「送出答案」：檢查是否答對
    function checkAnswer() {
      // 如果還沒開始 (currentIndex == -1)，無法作答
      if (currentIndex < 0) {
        resultDiv.style.color = "red";
        resultDiv.textContent = "請先按「下一題」開始遊戲！";
        return;
      }
      // 若已經全部答完了 (currentIndex >= riddles.length)，也給個提示
      if (currentIndex >= riddles.length) {
        resultDiv.style.color = "blue";
        resultDiv.textContent = "題目已全部結束，無法再作答。";
        return;
      }

      const riddle = riddles[currentIndex];

      // 取得選中的 radio
      const selectedOption = document.querySelector('input[name="riddleOption"]:checked');
      if (!selectedOption) {
        resultDiv.style.color = "red";
        resultDiv.textContent = "請先選擇一個答案！";
        return;
      }

      const userChoice = parseInt(selectedOption.value, 10);
      const correctIndex = riddle.correctIndex;

      if (userChoice === correctIndex) {
        resultDiv.style.color = "green";
        resultDiv.textContent = "恭喜你，答對了！";
        score++;
      } else {
        resultDiv.style.color = "red";
        resultDiv.textContent = `很可惜，正確答案是：「${riddle.options[correctIndex]}」`;
      }

      total++;
      scoreDiv.textContent = `目前分數：${score}/${total}`;
    }

    // 綁定按鈕事件
    nextBtn.addEventListener("click", nextRiddle);
    submitBtn.addEventListener("click", checkAnswer);
  </script>
</body>
</html>
